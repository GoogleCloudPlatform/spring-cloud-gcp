name: Linkage Check

on:
  pull_request:
    branches:
      - 'dependabot/**'
  workflow_dispatch:
  schedule:
    - cron: '00 9 * * *' # 09:00 UTC every day

jobs:
  linkageCheck:
    if: |
      ((
        github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name
      ) || (github.event_name != 'pull_request'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d' --utc)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 8
          distribution: temurin
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: mvn-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-unified-${{ steps.date.outputs.date }}
      - name: install
        # install before running Linkage Checker
        run: |
          ./mvnw \
             --batch-mode \
             --no-transfer-progress \
             --show-version \
             --threads 1.5C \
             --define skipTests=true \
             --define maven.javadoc.skip=true \
             --errors \
             install
      - name: run linkage checker
        run: |
          ./mvnw \
            --activate-profiles linkage-check \
            --projects spring-cloud-gcp-dependencies \
            --batch-mode \
            --no-transfer-progress \
            --show-version \
            --threads 1.5C \
            --define skipTests=true \
            --define maven.javadoc.skip=true \
            --errors \
            verify
