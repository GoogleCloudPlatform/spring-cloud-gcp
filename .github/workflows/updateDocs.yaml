name: Update Docs

on:
  pull_request:
  push:
    branches:
    - main
    paths:
    - 'docs/**'
  release:
    types: [published] # includes pre-release and regular releases, but does not include draft releases.
  workflow_dispatch:
    inputs:
      committish:
        description: Tag or branch of the docs to be created or updated. Using `main` will update the landing page. Using anything else will create or update a versioned copy of the docs.
        required: true
        default: main

jobs:
  updateDocs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d' --utc)" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v3
    - run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - uses: actions/cache@v4
      id: mvn-cache
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-unified-${{ steps.date.outputs.date }}

    - name: Mvn install # Need this when the version/directory/pom structure changes
      run: |
        ./mvnw \
          --batch-mode \
          --no-transfer-progress \
          --show-version \
          --threads 1.5C \
          --define maven.test.skip=true \
          --define maven.javadoc.skip=true \
          install

    - name: Remove SNAPSHOT # Needed for releases
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        if [[ -n "$TAG_NAME" ]] ; then
          ./mvnw versions:set --batch-mode -DremoveSnapshot -DprocessAllModules
        fi

    - name: Update Docs
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
        COMMITTISH: ${{ github.event.inputs.committish }}
      run: |
        if [[ -n "$TAG_NAME" ]] ; then
          ./docs/src/main/asciidoc/ghpages.sh --version "$TAG_NAME" --destination . --build
        elif [[ -n "$COMMITTISH" ]] && [[ "$COMMITTISH" != "main" ]] ; then
            ./docs/src/main/asciidoc/ghpages.sh --version "$COMMITTISH" --destination . --build
        else
          ./mvnw install -P docs -P '!CI' -pl docs -DskipTests # Simplified PR check
        fi
